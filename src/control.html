<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>MangNotch Control Center</title>
  <link rel="stylesheet" href="./shared/glass.css">
  <link rel="stylesheet" href="./control/styles/layout.css">
  <link rel="stylesheet" href="./control/styles/controls.css">
</head>
<body oncontextmenu="return false;">

  <div id="forcedUpdateModal" class="forced-modal">
    <div class="card forced-modal-card">
      <h2 id="forcedTitle" style="margin:0 0 8px;font-size:18px;color:var(--ink)"></h2>
      <p id="forcedNotes" style="margin:0 0 18px;font-size:12px;color:var(--mist);line-height:1.5"></p>
      <button class="g-btn primary" id="forcedUpdateBtn" style="width:100%;height:36px"></button>
    </div>
  </div>

  <div class="ctrl-window">
    <aside class="ctrl-sidebar" id="sidebarDragArea">
      <div class="ctrl-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="settingsSearch" placeholder="Search Controls">
      </div>

      <nav class="ctrl-nav" id="ctrlNav">
        <div class="nav-pill" id="navPill"></div>
      </nav>

      <div class="sidebar-footer">
        <div class="brand-left">
          <div class="brand-logo"><img class="js-app-logo" alt="MangNotch"></div>
          <b>MangNotch</b>
        </div>
        <span class="ver-pill" id="hdrVerPill">v2.1.1</span>
      </div>
    </aside>

    <main class="ctrl-main">
      <header class="ctrl-topbar" id="topbarDragArea">
        <h2 id="activePaneTitle">General & Display</h2>
        <div class="topbar-actions">
          <button class="g-btn" id="clearShelfBtn">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
            <span id="clearShelfTxt">Clear Shelf</span>
          </button>
          <button class="g-btn icon-only close-btn" id="closeBtn">
            <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </header>

      <div class="ctrl-content" id="ctrlContent">
        <div id="updateBanner" class="update-banner">
          <div>
            <b id="updateBannerTitle"></b>
            <small id="updateBannerSub"></small>
          </div>
          <button class="g-btn primary" id="updateBannerBtn"></button>
        </div>

        <div class="hero-card" id="heroPreview">
          <div class="hero-text">
            <b>Living Notch Companion</b>
            <p id="heroSubtitle"></p>
          </div>
          <div class="notch-prev">
            <div class="np-notch" id="npNotch">
              <div class="np-glow"></div>
              <div class="np-mascot" id="npMascot"></div>
            </div>
          </div>
        </div>

        <div id="tabMount"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast">Saved ✓</div>
  <script type="module" src="./control/main.js"></script>
</body>
</html>
